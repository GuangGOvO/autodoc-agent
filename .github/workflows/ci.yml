name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: 准备 .env（测试值，不含真实密钥）
        run: |
          cat > .env <<'EOF'
          DEEPSEEK_API_KEY=ci-placeholder-not-a-real-key
          DEEPSEEK_BASE_URL=https://api.deepseek.com
          DEEPSEEK_MODEL=deepseek-v4-flash
          POSTGRES_USER=autodoc
          POSTGRES_PASSWORD=ci-db-password-please-change
          POSTGRES_DB=autodoc
          DATABASE_URL=postgres://autodoc:ci-db-password-please-change@localhost:5432/autodoc
          JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef
          COOKIE_SECURE=false
          EOF
      - name: 构建并启动
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' autodoc-agent 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          docker compose ps
      - name: 执行数据库迁移
        run: docker compose exec -T app node scripts/migrate.mjs
      - name: API 冒烟（注册 → 登录 → 车辆 → 统计）
        run: |
          set -e
          base=http://127.0.0.1:3000
          curl -sf -X POST "$base/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.local","password":"password123","username":"citest"}' > /dev/null
          curl -sf -c /tmp/cookies.txt -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"citest","password":"password123"}' > /dev/null
          curl -sf -b /tmp/cookies.txt -X POST "$base/api/vehicles" \
            -H 'Content-Type: application/json' \
            -d '{"brand":"测试","series":"冒烟","mileage":100}' > /dev/null
          curl -sf -b /tmp/cookies.txt "$base/api/stats" | grep -q '"totalVehicles":1'
          echo 'SMOKE OK'
      - name: 清理
        if: always()
        run: docker compose down -v

services:
  db:
    image: postgres:16-alpine
    container_name: autodoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autodoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodoc}
      POSTGRES_DB: ${POSTGRES_DB:-autodoc}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autodoc} -d ${POSTGRES_DB:-autodoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autodoc-agent:latest
    container_name: autodoc-agent
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    # 运行期注入环境变量（.env 已被 gitignore/.dockerignore 排除，不会打进镜像）
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autodoc}:${POSTGRES_PASSWORD:-autodoc}@db:5432/${POSTGRES_DB:-autodoc}

volumes:
  db-data:

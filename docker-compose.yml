services:
  db:
    image: postgres:16-alpine
    container_name: autodoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autodoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（cp .env.example .env 后修改）}
      POSTGRES_DB: ${POSTGRES_DB:-autodoc}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 本地开发：让宿主机可用 localhost:5432 跑 npm run db:migrate / psql
      # 生产环境建议移除，避免端口暴露
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autodoc} -d ${POSTGRES_DB:-autodoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autodoc-agent:latest
    container_name: autodoc-agent
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    # 运行期注入环境变量（.env 已被 gitignore/.dockerignore 排除，不会打进镜像）
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autodoc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}@db:5432/${POSTGRES_DB:-autodoc}

volumes:
  db-data:
